name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-backend:
    name: Backend Lint & Format (ruff)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Ruff
        run: pip install ruff
      - name: Run Ruff Linter
        run: ruff check . --select E,F --ignore E501,E402 --exclude tests/upload_cases
      - name: Run Ruff Formatter check
        run: ruff format --check . --exclude tests/upload_cases

  security-backend:
    name: Backend Security (bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Security Check
        run: bandit -r . -x ./tests,./explorer,./node_modules -ll -ii

  test-backend:
    name: Backend Tests & Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov
      - name: Run tests with coverage
        run: python -m pytest tests/ -v --cov=. --cov-report=xml
        env:
          GROQ_API_KEY: dummy-key-for-ci
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: coverage.xml
          retention-days: 14

  typecheck-backend:
    name: Backend Type check (mypy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run mypy
        run: mypy . --ignore-missing-imports --python-version 3.12 --exclude tests --explicit-package-bases --disable-error-code=import-untyped

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Install Dependencies
        run: npm ci
        working-directory: explorer
      - name: Frontend Linting
        run: npm run lint
        working-directory: explorer
      - name: Frontend Build
        run: npm run build
        working-directory: explorer
      - name: Frontend Tests
        run: npx vitest run
        working-directory: explorer
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: explorer/dist/
          retention-days: 14

  backend-changes:
    name: Detect backend changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deploy: ${{ steps.detect.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check for deploy-relevant paths
        id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # What the Fly image is built from (Dockerfile.fly) plus the deploy config.
          paths=(app teacher analyst serve.py main.py requirements.txt Dockerfile.fly fly.toml .github/workflows/fly.yml)
          deploy=true
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "No previous commit for this push; deploying."
          elif ! git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            echo "$BEFORE is unknown or not an ancestor of $AFTER (force push?); deploying."
          else
            changed=$(git diff --name-only --no-renames "$BEFORE" "$AFTER" -- "${paths[@]}")
            if [[ -n "$changed" ]]; then
              echo "Deploy-relevant changes in $BEFORE..$AFTER:"
              echo "$changed"
            else
              deploy=false
              echo "No deploy-relevant changes in $BEFORE..$AFTER; skipping deploy."
            fi
          fi
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  # Pull requests skip this job, because backend-changes only runs on main.
  deploy-backend:
    name: Deploy backend
    needs: [lint-backend, security-backend, test-backend, typecheck-backend, frontend, backend-changes]
    if: success() && needs.backend-changes.outputs.deploy == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/fly.yml
    secrets: inherit
